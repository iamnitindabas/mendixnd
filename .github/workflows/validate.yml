name: Validate Agent Skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate skill format
        run: npx --yes skills-ref validate ./skills/mendixnd

      - name: List discovered skills
        run: npx --yes skills add . --list -a universal -y
